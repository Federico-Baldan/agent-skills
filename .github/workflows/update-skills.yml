name: Update skills

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    name: Update upstream skills
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write # to report this job's checks on the bot commit (GITHUB_TOKEN pushes don't start other workflows)
    env:
      BRANCH: bot/update-skills
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Update upstream skills that have been stable upstream long enough
        env:
          GITHUB_TOKEN: ${{ github.token }} # read-only GitHub API calls for the age check and the CLI
          MIN_AGE_DAYS: ${{ vars.SKILL_MIN_AGE_DAYS || '7' }}
        run: npm run skills:update -- --min-age "$MIN_AGE_DAYS"
      - run: npm test
      - run: npm run skills:validate

      - name: Open, refresh or close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE_SKILL_UPDATES }}
          MIN_AGE_DAYS: ${{ vars.SKILL_MIN_AGE_DAYS || '7' }}
        run: |
          if [ "$BASE" = "$BRANCH" ]; then
            echo "Run this workflow from the default branch, not from $BRANCH."
            exit 1
          fi
          open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"

          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "All upstream skills are already up to date."
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch --comment 'Superseded: the upstream skills already match the default branch.'
            elif git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
              git push origin --delete "$BRANCH" # left behind by an auto-merged PR
            fi
            exit 0
          fi

          # Only skill content, the lock/integrity files and the catalog may change.
          unexpected="$(git status --porcelain=v1 -z --untracked-files=all | tr '\0' '\n' | cut -c4- \
            | grep -Ev '^(skills/|upstream/skills-lock\.json$|upstream/integrity\.json$|CATALOG\.md$)' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files changed by the update:\n%s\n' "$unexpected"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add -A -- skills upstream/skills-lock.json upstream/integrity.json CATALOG.md
          skills_changed="$(git -c core.quotePath=false diff --cached --name-only -- skills | cut -d/ -f2 | sort -u | sed 's/^/- /')"
          git commit -m 'chore(skills): update upstream skills'
          git push --force origin "$BRANCH"

          {
            echo "The weekly skills update found new versions of these upstream skills (each unchanged upstream for at least $MIN_AGE_DAYS days):"
            echo
            printf '%s\n' "$skills_changed"
            echo
            cat <<'MD'
          Skills run with the full permissions of your agents: read the diff before merging.
          After merging, machines pick it up with `npx skills update -g` (daily if `npm run skills:autoupdate -- enable` is on).
          MD
          } > "$RUNNER_TEMP/body.md"

          if [ -z "$open_pr" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title 'chore(skills): update upstream skills' --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$open_pr" --body-file "$RUNNER_TEMP/body.md"
          fi

          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"

          # Turn on native auto-merge first, while the new commit has no checks yet: GitHub then merges by itself
          # the moment the checks below are reported, so there's no race with a merge we'd trigger ourselves.
          if [ "$AUTO_MERGE" = 'true' ] && [ "$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null')" != 'true' ]; then
            gh pr merge "$pr" --auto --squash
          fi

          # This job just ran the tests, the validation and the pinned skills CLI on exactly this commit, so it reports
          # the two checks main requires. (Runs started by GITHUB_TOKEN never show up as PR checks, so we can't rely on them.)
          sha="$(git rev-parse HEAD)"
          for context in 'Validate skills' 'Skills CLI smoke test'; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context="$context" \
              -f description='Passed in the Update skills workflow' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          done
